[project]
name = "quilr-ai-gateway-assessment"
version = "1.0.0"
description = "MCP server, MCP security gateway, streaming PII guardrail and model router for LLM gateways."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.10,<2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "regex>=2024.5.15",
]

[project.scripts]
customer-mcp = "customer_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/customer_mcp",
    "src/mcp_gateway",
    "src/stream_guardrail",
    "src/model_router",
    "src/mocks",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true